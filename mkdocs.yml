site_name: Большая Энциклопедия NewEra и Эррландии
site_description: "Открытый архив знаний о Эррландии, созданный сообществом игроков. "
site_author: "NorthFern"
site_url: https://northfern.github.io/NewEraWiki/
repo_url: https://github.com/northfern/NewEraWiki
edit_uri: edit/main/docs/
view_uri: raw/main/docs/

copyright: >
  <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">
    <img src="https://i.creativecommons.org/l/by-sa/4.0/80x15.png" alt="CC BY-SA 4.0" style="vertical-align: middle; margin-right: 4px;">
    CC BY-SA 4.0
  </a>
  · 2026 Большая Энциклопедия NewEra и Эррландии (16+). <u><a href="/NewEraWiki/legal/">Правовая информация</a></u>

extra_css:
  - stylesheets/custom.css  
extra_javascript:
  - javascripts/nav-toggle.js
  - javascripts/author-banner.js
  - javascripts/cms-edit.js
  
theme:
  name: material
  custom_dir: overrides
  language: ru
  font:
    text: Inter
    code: JetBrains Mono
  logo: images/favicon.png
  favicon: images/favicon.png
  
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Переключить на светлую тему

    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Переключить на темную тему

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Переключить на системную тему
  
  features:
    - content.action.edit
    - content.action.view
    - navigation.sections
    - navigation.prune
    - navigation.top
    - navigation.tabs
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - blog:
      pagination_per_page: 5
  - rss:
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: "date"
      categories:
        - categories
        - tags
  - awesome-pages
  - obsidian-support
  - roamlinks
  - git-authors:
      enabled: !ENV [CI, false]
  - git-revision-date-localized:
      type: date          # Формат даты
      locale: ru          # Русский язык
      fallback_to_build_date: true  # Если Git недоступен
markdown_extensions:
  - toc:
      permalink: true
      permalink_title: Ссылка на раздел
  - admonition
  - footnotes
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  
extra:
  generator: true
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.gg/pvYxRYx5Sy
      name: Discord
    - icon: material/fountain-pen
      link: /NewEraWiki/admin/
      name: Редакция (Decap CMS)
