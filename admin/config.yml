locale: ru

backend:
  name: github
  repo: northfern/NewEraWiki
  branch: main
  base_url: https://sveltia-cms-auth.lthaeshenl.workers.dev/
  open_authoring: true

publish_mode: editorial_workflow

media_folder: "docs/images"
public_folder: "/images"

slug:
  encoding: "unicode"      # сохраняет кириллицу, но санитизирует пробелы
  clean_accents: true
  sanitize_replacement: "-"
  
collections:
  - name: main
    label: "Главная"
    folder: "docs"
    create: false
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - name: title
        label: "Название"
        widget: string
      - name: body
        label: "Текст"
        widget: markdown

  - name: authory
    label: "Органы власти"
    label_singular: "Орган власти"
    folder: "docs/organisations/authory"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: "Название", widget: string }
      - { name: body, label: "Текст", widget: markdown }
      
  - name: goverments
    label: "Государства"
    label_singular: "Государство"
    folder: "docs/organisations/goverments"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: "Название", widget: string }
      - { name: body, label: "Текст", widget: markdown }

  - name: military
    label: "Военные организации"
    label_singular: "Военная организация"
    folder: "docs/organisations/military"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: "Название", widget: string }
      - { name: body, label: "Текст", widget: markdown }

  - name: parties
    label: "Партии"
    label_singular: "Партия"
    folder: "docs/organisations/parties"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: "Название", widget: string }
      - { name: body, label: "Текст", widget: markdown }

  - name: unions
    label: "Кружки, коллективы, объединения"
    label_singular: "Организация"
    folder: "docs/organisations/unions"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: "Название", widget: string }
      - { name: body, label: "Текст", widget: markdown }

  - name: flaseologisms
    label: "Фразеологизмы"
    label_singular: "Фразеологизм"
    folder: "docs/termins/flaseologisms"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: "Название", widget: string }
      - { name: body, label: "Текст", widget: markdown }

  - name: ideology
    label: "Идеологии"
    label_singular: "Идеология"
    folder: "docs/termins/ideology"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: "Название", widget: string }
      - { name: body, label: "Текст", widget: markdown }

  - name: terms
    label: "Термины"
    label_singular: "Термин"
