    label_singular: "Книга"
    folder: "docs/books"
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { name: title, label: "Название", widget: string }
      - { name: author, label: "Автор текста", widget: string, required: false }
      - { name: date, label: "Дата", widget: string, required: false,
          hint: 'В кавычках: "12 мая 2026"' }
      - { name: source, label: "Источник переноса (URL)", widget: string, required: false }
      - { name: body, label: "Текст", widget: markdown }

  - name: documents
    label: "Документы"
    label_singular: "Документ"
    folder: "docs/documents"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: "Название", widget: string }
      - { name: date, label: "Дата", widget: string, required: false }
      - { name: author, label: "Автор текста", widget: string, required: false }
      - { name: body, label: "Текст", widget: markdown }
